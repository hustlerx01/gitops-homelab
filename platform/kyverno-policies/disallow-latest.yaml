apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata: {name: disallow-latest-tag}
spec:
  validationFailureAction: Audit   # roll out in Audit, flip to Enforce after PolicyReports are clean
  background: true
  rules:
    - name: require-tag
      match: {any: [{resources: {kinds: [Pod], namespaces: [hello]}}]}
      validate:
        message: "Pin image tags."
        pattern: {spec: {containers: [{image: "!*:latest"}]}}
