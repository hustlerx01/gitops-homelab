apiVersion: v1
kind: Service
metadata:
  name: hello
  namespace: hello
spec:
  ports:
  - port: 80
    targetPort: 8080
  selector:
    app: hello
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: hello
  name: hello
  namespace: hello
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello
  template:
    metadata:
      labels:
        app: hello
    spec:
      automountServiceAccountToken: false
      containers:
      - image: gcr.io/google-samples/hello-app:2.0
        name: hello
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /
            port: 8080
        resources:
          limits:
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: hello-api
  namespace: hello
spec:
  encryptedData:
    token: AgPLACEHOLDER-not-a-real-ciphertext==
  template:
    metadata:
      name: hello-api
      namespace: hello
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-8080
  namespace: hello
spec:
  ingress:
  - ports:
    - port: 8080
  podSelector:
    matchLabels:
      app: hello
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: hello
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
