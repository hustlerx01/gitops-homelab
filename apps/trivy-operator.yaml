apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trivy-operator
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "0"}
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: homelab
  source:
    repoURL: https://aquasecurity.github.io/helm-charts/
    chart: trivy-operator
    targetRevision: 0.37.0
    helm:
      valuesObject:
        trivy: {ignoreUnfixed: true, severity: "HIGH,CRITICAL"}
        operator: {scanJobsConcurrentLimit: 2}
        serviceMonitor: {enabled: true}
  destination: {server: https://kubernetes.default.svc, namespace: trivy-system}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    retry: {limit: 5, backoff: {duration: 10s, factor: 2, maxDuration: 3m}}
