# The ONLY manifest applied by hand: kubectl apply -n argocd -f bootstrap/
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: homelab
  source:
    repoURL: https://github.com/ansarshaikh/gitops-homelab.git
    targetRevision: main
    path: apps
  destination: {server: https://kubernetes.default.svc, namespace: argocd}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
